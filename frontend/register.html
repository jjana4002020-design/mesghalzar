<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت‌نام | مثقال زر</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--gold:#ffd700;--gold-dark:#b8860b;--bg:#080810;--bg-light:#12121f;--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,215,0,0.08);--text:#fff;--text-muted:#8b8b9e;--danger:#ff4757;--success:#00d084}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.bg-animation{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:4px;height:4px;background:var(--gold);border-radius:50%;opacity:0.3;animation:float 15s infinite;box-shadow:0 0 10px var(--gold)}
@keyframes float{0%,100%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-10vh) rotate(720deg);opacity:0}}

.auth-container{width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:30px;font-size:1.8rem;color:var(--gold);font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px}
.auth-box{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:24px;padding:40px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.auth-title{text-align:center;font-size:1.6rem;margin-bottom:8px;font-weight:800;color:var(--gold)}
.auth-subtitle{text-align:center;color:var(--text-muted);font-size:0.9rem;margin-bottom:30px}
.input-group{margin-bottom:20px}
.input-group label{display:block;margin-bottom:8px;color:var(--text-muted);font-size:0.9rem}
.input-group input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(0,0,0,0.2);color:var(--text);font-size:1rem;font-family:inherit;transition:all 0.3s}
.input-group input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,0.1)}
.input-group input::placeholder{color:#555}
.auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;border:none;border-radius:12px;font-size:1.1rem;font-weight:800;cursor:pointer;margin-top:10px;transition:all 0.3s;font-family:inherit;box-shadow:0 4px 15px rgba(255,215,0,0.3)}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,215,0,0.5)}
.auth-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.auth-footer{text-align:center;margin-top:25px;color:var(--text-muted);font-size:0.9rem}
.auth-footer a{color:var(--gold);text-decoration:none;font-weight:700;transition:opacity 0.3s}
.auth-footer a:hover{opacity:0.8}
.error-msg{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:var(--danger);padding:12px;border-radius:10px;margin-bottom:20px;font-size:0.9rem;display:none}
.success-msg{background:rgba(0,208,132,0.1);border:1px solid rgba(0,208,132,0.3);color:var(--success);padding:12px;border-radius:10px;margin-bottom:20px;font-size:0.9rem;display:none}
</style>
</head>
<body>
<div class="bg-animation" id="particles"></div>

<div class="auth-container">
  <a href="/" class="auth-logo"><i class="fas fa-coins"></i> مثقال زر</a>
  
  <div class="auth-box">
    <h1 class="auth-title">📝 ثبت‌نام</h1>
    <p class="auth-subtitle">حساب کاربری جدید بسازید</p>
    
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    
    <form id="registerForm">
      <div class="input-group">
        <label>نام و نام خانوادگی</label>
        <input type="text" id="name" placeholder="مثلاً علی احمدی" required>
      </div>
      <div class="input-group">
        <label>شماره موبایل</label>
        <input type="tel" id="phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required>
      </div>
      <div class="input-group">
        <label>ایمیل (اختیاری)</label>
        <input type="email" id="email" placeholder="example@gmail.com">
      </div>
      <div class="input-group">
        <label>رمز عبور</label>
        <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" required>
      </div>
      <button type="submit" class="auth-btn" id="submitBtn">ثبت‌نام</button>
    </form>
    
    <div class="auth-footer">
      قبلاً حساب دارید؟ <a href="login.html">وارد شوید</a>
    </div>
  </div>
</div>

<script>
function createParticles(){
  const container=document.getElementById("particles");
  for(let i=0;i<20;i++){
    const p=document.createElement("div");p.className="particle";
    p.style.left=Math.random()*100+"%";p.style.animationDelay=Math.random()*15+"s";
    p.style.animationDuration=(10+Math.random()*10)+"s";p.style.width=(2+Math.random()*4)+"px";p.style.height=p.style.width;
    container.appendChild(p);
  }
}
createParticles();

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  
  btn.disabled = true;
  btn.textContent = 'در حال ثبت‌نام...';
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
  
  try {
    const res = await fetch('/api/v1/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value || undefined,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      successMsg.textContent = 'ثبت‌نام با موفقیت انجام شد! در حال انتقال...';
      successMsg.style.display = 'block';
      setTimeout(() => window.location.href = '/', 1500);
    } else {
      errorMsg.textContent = data.error || 'خطایی رخ داد';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'ثبت‌نام';
    }
  } catch (err) {
    errorMsg.textContent = 'خطای شبکه. دوباره تلاش کنید.';
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'ثبت‌نام';
  }
});
</script>
</body>
</html>
